<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inserisci il codice</title>
<link rel="icon" href="favicon.ico" type="image/x-icon" sizes="16x16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --rosso-scuro:#8c1132;
    --rosso-vivo:#c9203f;
    --rosa:#ff8fae;
    --rosa-chiaro:#ffe1ea;
    --rosa-pallido:#fff5f8;
    --bianco:#ffffff;
    --font-display:'Cormorant Garamond', serif;
    --font-ui:'Manrope', sans-serif;

    /* tonalità "pongo" grigio */
    --clay-1:#dcdcdc;
    --clay-2:#b6b6b6;
    --clay-3:#8f8f8f;
    --clay-4:#6f6f6f;
    --clay-ink:#4a4a4a;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:var(--font-ui);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 12% 15%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 40%),
      radial-gradient(circle at 88% 20%, rgba(255,143,174,0.55) 0%, rgba(255,143,174,0) 45%),
      radial-gradient(circle at 20% 90%, rgba(201,32,63,0.35) 0%, rgba(201,32,63,0) 50%),
      radial-gradient(circle at 85% 88%, rgba(255,225,234,0.9) 0%, rgba(255,225,234,0) 45%),
      linear-gradient(155deg, #fff5f8 0%, #ffe1ea 45%, #ffc3d3 100%);
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  .lock-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.6rem;
    padding:1.5rem;
  }

  .lock-hint{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.35rem;
  }
  .lock-heart{
    color:var(--rosso-vivo);
    font-size:1.6rem;
    animation:battito-lieve 1.6s ease-in-out infinite;
  }
  @keyframes battito-lieve{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.18); }
  }
  .lock-hint p{
    margin:0;
    font-family:var(--font-display);
    font-style:italic;
    font-size:1.3rem;
    color:var(--rosso-scuro);
  }

  /* ---------- SCHERMO CON I PALLINI ---------- */
  .display-screen{
    display:flex;
    gap:1rem;
    padding:0.9rem 1.4rem;
    background:linear-gradient(155deg, #ffffff, #fff0f4);
    border-radius:18px;
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.9),
      inset 0 -3px 6px rgba(201,32,63,0.08),
      0 8px 18px rgba(140,17,50,0.18);
  }
  .dot{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#f6d8e0;
    box-shadow:inset 0 1px 2px rgba(140,17,50,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-ui);
    font-weight:800;
    font-size:0.85rem;
    color:var(--rosso-scuro);
    transition:background 0.15s ease, transform 0.15s ease;
    overflow:hidden;
  }
  .dot.filled{
    background:var(--rosso-vivo);
    transform:scale(1.05);
  }
  .dot.reveal{
    background:#ffffff;
  }

  .display-screen.shake{
    animation:trema 0.45s ease;
  }
  @keyframes trema{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-9px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-6px); }
    80%{ transform:translateX(4px); }
  }
  .display-screen.successo .dot{
    background:var(--rosso-vivo);
    box-shadow:0 0 10px rgba(201,32,63,0.7);
  }

  .error-msg{
    height:1.1rem;
    margin:0;
    font-size:0.85rem;
    font-weight:700;
    color:var(--rosso-scuro);
    opacity:0;
    transition:opacity 0.25s ease;
  }
  .error-msg.show{ opacity:1; }

  /* ---------- IL TASTIERINO DI PONGO ---------- */
  .keypad-panel{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1.1rem;
    padding:1.6rem;
    border-radius:36px;
    background:linear-gradient(150deg, #d4d4d4 0%, #b0b0b0 55%, #929292 100%);
    box-shadow:
      inset 0 3px 6px rgba(255,255,255,0.6),
      inset 0 -8px 16px rgba(0,0,0,0.18),
      0 22px 40px rgba(90,20,35,0.28);
  }

  .key{
    -webkit-tap-highlight-color:transparent;
    position:relative;
    width:74px;
    height:74px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    cursor:pointer;
    font-family:var(--font-ui);
    font-size:1.5rem;
    font-weight:800;
    color:var(--clay-ink);
    background:radial-gradient(circle at 32% 28%, var(--clay-1) 0%, var(--clay-2) 45%, var(--clay-3) 85%);
    border-radius:46% 42% 44% 48% / 48% 44% 46% 42%;
    box-shadow:
      inset 2px 3px 5px rgba(255,255,255,0.75),
      inset -3px -5px 7px rgba(0,0,0,0.28),
      0 9px 0 var(--clay-4),
      0 12px 16px rgba(0,0,0,0.35);
    transform:translateY(0);
    transition:transform 0.1s ease-out, box-shadow 0.1s ease-out;
  }
  .key:nth-child(2){ border-radius:44% 48% 46% 42% / 42% 48% 44% 46%; }
  .key:nth-child(3){ border-radius:48% 44% 42% 46% / 46% 42% 48% 44%; }
  .key:nth-child(4){ border-radius:42% 46% 48% 44% / 44% 46% 42% 48%; }
  .key:nth-child(6){ border-radius:47% 43% 45% 49% / 45% 49% 43% 47%; }
  .key:nth-child(7){ border-radius:43% 47% 49% 45% / 49% 45% 47% 43%; }
  .key:nth-child(9){ border-radius:45% 49% 43% 47% / 43% 47% 49% 45%; }

  .key-action{
    font-size:1.25rem;
    color:var(--rosso-scuro);
  }

  .key:hover{
    filter:brightness(1.04);
  }

  .key.pressed,
  .key:active{
    transform:translateY(7px) scale(0.93);
    box-shadow:
      inset 2px 3px 6px rgba(0,0,0,0.32),
      inset -1px -2px 4px rgba(255,255,255,0.35),
      0 2px 0 var(--clay-4),
      0 3px 6px rgba(0,0,0,0.3);
  }

  .keypad-panel.shake{
    animation:trema 0.45s ease;
  }

  @media (max-width:420px){
    .key{ width:64px; height:64px; font-size:1.3rem; }
    .keypad-panel{ gap:0.85rem; padding:1.3rem; }
  }
</style>
</head>
<body>

  <main class="lock-wrapper">
    <div class="lock-hint">
      <span class="lock-heart">&#10084;</span>
      <p>Inserisci la nostra password...indizio, Lo sai Sherlok</p>
    </div>

    <div class="display-screen" id="displayScreen">
      <div class="dot" data-index="0"></div>
      <div class="dot" data-index="1"></div>
      <div class="dot" data-index="2"></div>
      <div class="dot" data-index="3"></div>
    </div>

    <p class="error-msg" id="errorMsg">Codice errato, riprova</p>

    <div class="keypad-panel" id="keypad">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key key-action" data-key="clear" aria-label="Cancella">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 6h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-6-6a1.2 1.2 0 0 1 0-1.7L9 6z"/>
          <path d="M13.5 10l4 4M17.5 10l-4 4"/>
        </svg>
      </button>
      <button class="key" data-key="0">0</button>
      <button class="key key-action" data-key="enter" aria-label="Conferma">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12.5l5 5L20 6.5"/>
        </svg>
      </button>
    </div>
  </main>

  <script>
    /* =======================================================
       CONFIGURAZIONE — modifica qui il codice e la pagina di destinazione
    ======================================================= */
    const CODICE_CORRETTO = "1409";       // es. 14/02 = San Valentino
    const PAGINA_DESTINAZIONE = "home.html";
    /* ======================================================= */

    const dots = Array.from(document.querySelectorAll('.dot'));
    const displayScreen = document.getElementById('displayScreen');
    const keypad = document.getElementById('keypad');
    const errorMsg = document.getElementById('errorMsg');

    let inserito = "";
    let bloccato = false;

    function aggiornaSchermo(){
      dots.forEach((dot, i) => {
        dot.classList.toggle('filled', i < inserito.length);
      });
    }

    function mostraCifraTemporanea(indice, cifra){
      const dot = dots[indice];
      dot.textContent = cifra;
      dot.classList.add('reveal');
      setTimeout(() => {
        dot.textContent = "";
        dot.classList.remove('reveal');
      }, 260);
    }

    function reset(){
      inserito = "";
      aggiornaSchermo();
    }

    function errore(){
      errorMsg.classList.add('show');
      displayScreen.classList.add('shake');
      keypad.classList.add('shake');
      setTimeout(() => {
        displayScreen.classList.remove('shake');
        keypad.classList.remove('shake');
        reset();
      }, 450);
    }

    function successo(){
      errorMsg.classList.remove('show');
      displayScreen.classList.add('successo');
      setTimeout(() => {
        window.location.href = PAGINA_DESTINAZIONE;
      }, 550);
    }

    function verifica(){
      if (inserito === CODICE_CORRETTO){
        successo();
      } else {
        errore();
      }
    }

    function premi(tasto, key){
      key.classList.add('pressed');
      setTimeout(() => key.classList.remove('pressed'), 130);

      if (bloccato) return;

      if (tasto === 'clear'){
        inserito = inserito.slice(0, -1);
        aggiornaSchermo();
        return;
      }
      if (tasto === 'enter'){
        if (inserito.length > 0) verifica();
        return;
      }

      errorMsg.classList.remove('show');

      if (inserito.length < dots.length){
        const indice = inserito.length;
        inserito += tasto;
        mostraCifraTemporanea(indice, tasto);
        aggiornaSchermo();

        if (inserito.length === dots.length){
          bloccato = true;
          setTimeout(() => { verifica(); bloccato = false; }, 300);
        }
      }
    }

    document.querySelectorAll('.key').forEach(key => {
      key.addEventListener('click', () => premi(key.dataset.key, key));
    });

    document.addEventListener('keydown', (e) => {
      const tastoBtn = document.querySelector('.key[data-key="' + e.key + '"]');
      if (tastoBtn){ premi(e.key, tastoBtn); return; }
      if (e.key === 'Backspace'){
        const clearBtn = document.querySelector('.key[data-key="clear"]');
        premi('clear', clearBtn);
      }
      if (e.key === 'Enter'){
        const enterBtn = document.querySelector('.key[data-key="enter"]');
        premi('enter', enterBtn);
      }
    });
  </script>

</body>
</html>
